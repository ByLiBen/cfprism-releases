name: Import v1.1.0 release

on:
  push:
    tags:
      - v1.1.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify original asset
        shell: bash
        run: |
          set -euo pipefail
          asset="cfbest-sub-gui-offline-windows-amd64.zip"
          url="https://github.com/v15521596209/cfprism/releases/download/v1.1.0/${asset}"
          curl --fail --location --retry 3 --output "${asset}" "${url}"
          echo "13f48a70ad4923dafb5dfb370e0f24e694e71e7b3143d30818b9498efa19bd26  ${asset}" | sha256sum --check --strict

      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "cfbest-sub-gui-offline-windows-amd64.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "v1.1.0 优选质量增强" \
            --notes-file "RELEASE_NOTES_v1.1.0.md"
